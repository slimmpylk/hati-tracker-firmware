; PlatformIO alternative to Arduino IDE
; Run: pio run --target upload

[env:esp32]
platform     = espressif32
board        = esp32dev
framework    = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    vshymanskyy/TinyGSM @ ^0.11.7
    arduino-libraries/ArduinoHttpClient @ ^0.5.0

build_flags =
    -DTINY_GSM_MODEM_SIM7600
    -DCORE_DEBUG_LEVEL=0
